spring.application.name=productos-service
server.port=8081

# Eureka (Conexión al contenedor)
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka
eureka.instance.prefer-ip-address=true

# MongoDB (Con credenciales de Docker Compose)
spring.data.mongodb.uri=mongodb://admin:admin@mongodb:27017/productos?authSource=admin

# Kafka retry topics
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
broker.topics.products=${BROKER_TOPICS_PRODUCTS:product_retry_jobs}

# Logs de Debug para ver la conexión
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
